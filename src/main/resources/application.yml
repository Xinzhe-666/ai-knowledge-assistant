spring:
  application:
    name: ai-knowledge-assistant

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_knowledge_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms

  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xinzhe.aiassistant.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.xinzhe.aiassistant: debug
    org.springframework: info

jwt:
  secret: ${JWT_SECRET}
  expire-time: ${JWT_EXPIRE_TIME:7200000}

doubao:
  api-key: ${DOUBAO_API_KEY}
  api-url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
  model: ${DOUBAO_CHAT_MODEL:doubao-seed-2-0-lite-260215}
  temperature: ${DOUBAO_TEMPERATURE:0.7}
  embedding-url: ${DOUBAO_EMBEDDING_URL:https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal}
  embedding-model: ${DOUBAO_EMBEDDING_MODEL:doubao-embedding-vision-251215}

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}