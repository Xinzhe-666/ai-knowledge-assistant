# 生产环境配置：部署到服务器用
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://你的服务器MySQL地址:3306/ai_knowledge_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root #你的服务器MySQL用户名
    password: 123456    #你的服务器MySQL密码
  redis:
    host: localhost #你的服务器Redis地址
    port: 6379
    password: ""  #你的服务器Redis密码
    database: 0
    timeout: 10000

# 生产环境关闭SQL打印，避免日志太多
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl