services:
  # 后端服务
  ai-knowledge-assistant:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 容器内通过容器名访问mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ai_knowledge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      # 容器内通过容器名访问redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ai_knowledge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      # 这里替换成你自己的豆包API密钥
      - DOBAO_API_KEY=你的豆包API密钥
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: always

  # MySQL数据库（直接用官方源）
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_knowledge
    volumes:
      - mysql-data:/var/lib/mysql
      # 自动执行你的数据库初始化SQL脚本
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always

  # Redis缓存（直接用官方源）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

# 持久化卷
volumes:
  mysql-data:
  redis-data: